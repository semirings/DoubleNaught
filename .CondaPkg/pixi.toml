[dependencies]
openssl = ">=3, <3.6, >=3, <3.6"

    [dependencies.libpython]
    channel = "conda-forge"
    build = "**bundled-or-separate**"
    version = "*"

    [dependencies.python]
    channel = "conda-forge"
    build = "*cp*"
    version = ">=3.10,!=3.14.0,!=3.14.1,<4, >=3.10,!=3.14.0,!=3.14.1,<4"

[workspace]
name = ".CondaPkg"
platforms = ["osx-arm64"]
channels = ["conda-forge"]
channel-priority = "strict"
description = "automatically generated by CondaPkg.jl"
