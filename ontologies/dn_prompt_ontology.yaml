id: https://w3id.org/grej/dn-prompt-ontology
name: dn_prompt_ontology
description: >-
  DoubleNaught's layer over prompt_structure_ontology.yaml. Coding prompts for
  implementing things in DN. It extends Core: every Core intent, slot and rule
  is available here unchanged. This file adds DN's own domain classes (Node,
  Port, AaPayload, Pipeline, Environment, CloudTrainerJob), the Caption task
  (ImproveCaption), and two intents that make DN's environment rule a
  requirement: DNImplement and DNDiagnose must name the environment they act on.

  `rule` values are prose for the reader, not machine-checkable. The editor can
  insert a class's rule into a prompt's constraints when the prompt names that
  class; nothing here enforces it.

  The compile follows the import, so the parquet is the whole closure (Core +
  DN) and a DN prompt loads one file.

  Compile: python scripts/compile_linkml_to_aa.py
  ontologies/dn_prompt_ontology.yaml
  storage/ontologies/dn_prompt_ontology.parquet
  --tsv storage/ontologies/dn_prompt_ontology.tsv --extras

prefixes:
  linkml: https://w3id.org/linkml/
  dnp: https://example.org/dn-prompt-ontology#

default_prefix: dnp

imports:
  - linkml:types
  - prompt_structure_ontology

subsets:
  DN:
    description: "DoubleNaught's own domain layer. Extends Core."
  Caption:
    description: >-
      The segment/panel caption-improvement task (frontend/lib/widgets/nodes/implementations/llm/
      caption_task.dart). Extends Core. Authored directly in LinkML, from the Dart task's own
      enforced behavior.

classes:

  DNImplement:
    is_a: Implement
    description: "An Implement prompt for work in DN. Must say which filesystem the edit targets."
    in_subset:
      - DN
    annotations:
      rule: "these are two unrelated filesystems; a prompt must say which one an edit targets"
    slots:
      - environment_kind
    slot_usage:
      environment_kind:
        required: true

  DNDiagnose:
    is_a: Diagnose
    description: "A Diagnose prompt for a problem in DN. Must say which filesystem it concerns."
    in_subset:
      - DN
    slots:
      - environment_kind
    slot_usage:
      environment_kind:
        required: true

  Node:
    description: "A node in a DN node-graph pipeline."
    in_subset:
      - DN
    annotations:
      rule: "type and name vary independently; renaming the display name must never change type"
    slots:
      - node_type
      - node_name

  Port:
    description: "An input or output port on a DN Node; carries one AaPayload."
    in_subset:
      - DN
    slots:
      - carries

  AaPayload:
    description: "DN's associative-array payload: parallel rows/cols/vals lists, one entry per (row, col) cell."
    in_subset:
      - DN
    annotations:
      rule: "rows/cols/vals are three parallel flat lists, one entry per (row,col) cell -- never nested"
    slots:
      - rows
      - cols
      - vals

  Pipeline:
    description: "A DN workflow: a graph composed of Nodes."
    in_subset:
      - DN
    annotations:
      rule: "edits must stay backward compatible with type keys already saved on a live canvas"
    slots:
      - composed_of

  Environment:
    description: "A filesystem Claude can act against while working on DN."
    in_subset:
      - DN
    annotations:
      rule: "these are two unrelated filesystems; a prompt must say which one an edit targets"
    slots:
      - environment_kind

  CloudTrainerJob:
    description: "A Vertex AI cloud LoRA training job."
    in_subset:
      - DN
    annotations:
      rule: "a Diagnose prompt about training must include the [cloud_train] debug print lines, not just 'it errored'"
    slots:
      - job_state

  ImproveCaption:
    is_a: Intent
    description: >-
      A prompt asking an LLM to rewrite one segment's or panel's existing caption into a better
      one, via caption_task.dart's `fill()`.
    in_subset:
      - Caption
    annotations:
      rule: >-
        never invent a caption where the user wrote none -- a row with an empty raw_caption is
        skipped, not synthesized
    slots:
      - raw_caption
      - prompt_template
      - text_tag
    slot_usage:
      raw_caption:
        required: true
      prompt_template:
        required: true
      text_tag:
        required: false

slots:

  # DN.Node
  node_type:
    name: node_type
    slot_uri: dnp:type
    range: string
    required: true
    description: "The node's type key (e.g. 'saveAnteloraNode') -- never changes when the display name does."
  node_name:
    name: node_name
    slot_uri: dnp:name
    range: string
    required: true
    description: "The node's display name, editable independently of its type key."

  # DN.Port
  carries:
    range: AaPayload
    description: "What flows through this port."

  # DN.AaPayload
  rows:
    range: string
    multivalued: true
  cols:
    range: string
    multivalued: true
  vals:
    range: string
    multivalued: true

  # DN.Pipeline
  composed_of:
    range: Node
    multivalued: true
    description: "The nodes this pipeline is composed of."

  # DN.Environment
  environment_kind:
    range: EnvironmentKind

  # DN.CloudTrainerJob
  job_state:
    range: CloudTrainerJobState

  # Caption.ImproveCaption
  raw_caption:
    range: string
    description: "The user's (or VLM's) existing caption text to be improved. Never fabricated when absent."
  prompt_template:
    range: string
    description: >-
      The instructions supplied via a connected Prompt node. caption_task.dart raises an
      LLMTaskError ('segment captions need instructions' / 'panel captions need instructions')
      when this is missing -- it is required, there is no default template.
  text_tag:
    range: string
    required: false
    description: >-
      Optional per-segment tag (e.g. a LoRA trigger token), interpolated into prompt_template
      with `{{text_tag}}`. caption_task.dart passes it for segment rows.
enums:

  EnvironmentKind:
    description: "DN.Environment's known instances."
    permissible_values:
      device_bash:
        description: "A shell on the user's own computer, reached through the device bridge."
      container_filesystem:
        description: "The cloud container's own filesystem."

  CloudTrainerJobState:
    description: "DN.CloudTrainerJob's known states."
    permissible_values:
      submitted:
      running:
      failed:
      done:
