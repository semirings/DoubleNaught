id: https://w3id.org/grej/prompt-governance-ontology
name: prompt_governance_ontology
description: "LinkML schema governing narrative semantics, visual composition, and LoRA image generation constraints."

prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/prompt-guard#

default_prefix: ex

imports:
  - linkml:types

classes:
  PromptSpecification:
    description: "The top-level structured prompt payload validated by the matrix layer before generation."
    slots:
      - prompt_id
      - narrative_elements
      - visual_composition
      - visual_attributes
      - lora_activator

  NarrativeEntity:
    description: "Base class for all persistent story world elements."
    children_are_mutually_disjoint: true
    slots:
      - entity_name
      - description

  Character:
    is_a: NarrativeEntity
    description: "An actor or person within the narrative universe."
    slots:
      - canonical_outfit
      - current_state
      - current_location

  Setting:
    is_a: NarrativeEntity
    description: "A location or environmental backdrop."
    slots:
      - time_of_day
      - environmental_conditions

  Prop:
    is_a: NarrativeEntity
    description: >-
      Key physical objects or items. carried_by is optional, not required -- a Prop may be
      carried by a Character, or stand alone as the scene's own focal subject (a lamp, a cigar,
      a sign) with no carrier at all. Absence of carried_by does not mean an object fails to
      fit this class.
    slots:
      - carried_by

  Creature:
    is_a: NarrativeEntity
    description: >-
      A non-human living, acting subject -- an animal or personified creature. Added after
      auditing 88 real captions from storage/antelora/mccay: ~10% (a horse, a bird, a fish, a
      crab, two monkeys, a turkey, a reindeer) named a living subject that was neither a
      Character ("an actor or person") nor a Prop nor a Setting. Disjoint from Character/
      Setting/Prop via NarrativeEntity's children_are_mutually_disjoint.
    slots:
      - species
      - current_state
      - current_location

  VisualComposition:
    description: "Governs camera framing, perspective, and spatial layout."
    slots:
      - shot_type
      - camera_angle
      - focal_subject

  VisualAttribute:
    description: "Governs aesthetic texture, lighting, and style tokens."
    slots:
      - lighting_style
      - color_palette
      - target_lora_tag

slots:
  prompt_id:
    name: prompt_id
    range: string
    identifier: true
  narrative_elements:
    name: narrative_elements
    range: NarrativeEntity
    multivalued: true
  visual_composition:
    name: visual_composition
    range: VisualComposition
  visual_attributes:
    name: visual_attributes
    range: VisualAttribute
  lora_activator:
    name: lora_activator
    range: string

  entity_name:
    name: entity_name
    range: string
    required: true
  description:
    name: description
    range: string

  canonical_outfit:
    name: canonical_outfit
    range: string
  species:
    name: species
    range: string
    description: "What kind of creature this is (e.g. 'horse', 'bird', 'reindeer')."
  current_state:
    name: current_state
    range: string
  current_location:
    name: current_location
    range: Setting

  time_of_day:
    name: time_of_day
    range: string
  environmental_conditions:
    name: environmental_conditions
    range: string

  carried_by:
    name: carried_by
    description: >-
      Who or what this Prop is attached to -- a Character carrying it, or a Creature wearing/
      bearing it (e.g. a horse's saddle). Optional; see Prop's own description for standalone
      objects with no carrier at all.
    any_of:
      - range: Character
      - range: Creature

  shot_type:
    name: shot_type
    range: string
    description: "E.g., CloseUp, MediumShot, WideShot"
  camera_angle:
    name: camera_angle
    range: string
    description: "E.g., EyeLevel, LowAngle, BirdEye"
  focal_subject:
    name: focal_subject
    range: NarrativeEntity

  lighting_style:
    name: lighting_style
    range: string
    description: "E.g., CinematicStudio, Chiaroscuro, NaturalDaylight"
  color_palette:
    name: color_palette
    range: string
  target_lora_tag:
    name: target_lora_tag
    range: string
    description: "The exact trigger string that activates your trained Qwen LoRA."
