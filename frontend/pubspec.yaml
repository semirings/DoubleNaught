name: double_vision
description: "DoubleNaught Flutter front-end, built on the Vyuh framework."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Native/web file open dialog; XFile.openRead() gives a byte stream.
  file_selector: ^1.1.0

  # HTTP client for node→backend calls (e.g. the SAM3 segmentation API).
  http: ^1.6.0

  # Resolves an absolute, always-writable app directory. Required on sandboxed
  # macOS builds, where a CWD-relative path escapes the app container.
  path_provider: ^2.1.6

  # State management used by Vyuh
  mobx: ^2.3.0+1
  flutter_mobx: ^2.2.0+2
  go_router: ^17.0.0  # pinned by vyuh_core; ^14 cannot resolve
  flutter_riverpod: ^2.0.0

  # Sanity integration
  sanity_client: ^1.9.1
  flutter_sanity_portable_text: ^1.8.1

  # Vyuh framework
  vyuh_core: ^1.0.0
  vyuh_extension_content: ^1.32.0
  vyuh_feature_system: ^1.0.0
  vyuh_plugin_content_provider_sanity: ^1.15.0
  flutter_secure_storage: ^11.0.0
  cryptography: ^2.9.0
  idb_shim: ^2.9.7
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app binary so platform-channel paths (the OS keychain) are
  # exercised for real — see integration_test/keychain_vault_test.dart.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/png/
    - assets/svg/

flutter_launcher_icons:
  image_path: "img/app.png" # Standard master fallback image
  image_path_ios: "img/app.png"
  image_path_android: "img/app.png"
  image_path_macos: "img/app.icns" # Pointing directly to your compiled .icns file
  android: true
  ios: true
  macos:
    generate: true
    image_path: "img/app.icns"
  windows:
    generate: true
    image_path: "img/app.png"
